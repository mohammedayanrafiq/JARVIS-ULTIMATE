[package]
name = "jarvis-desktop"
version = "1.0.0"
description = "J.A.R.V.I.S — Persistent AI Desktop Assistant"
authors = ["Irfan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-notification = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
open = "5.0"
cpal = "0.15"
screenshots = "0.8"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "endpointvolumeapi", "mmdeviceapi", "combaseapi"] }

[features]
default = []
